[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainwerks"
version = "0.1.0"
description = "Deep learning on brain signals (EEG/MEG/ECoG) built on braindecode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BrainWerks" }]
keywords = ["eeg", "deep-learning", "braindecode", "pytorch", "bci", "neuroscience"]

dependencies = [
    "braindecode>=0.8",
    "torch>=2.0",
    "mne>=1.5",
    "skorch>=0.15",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Public benchmark datasets (Mother Of All BCI Benchmarks).
datasets = ["moabb>=1.0"]
# Development and testing tooling.
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/atifhalim/BrainWerks-"
Braindecode = "https://braindecode.org/stable/index.html"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
